<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>design-assets · 24 风格预览骨架</title>
  <style>
    :root { --ink:#2a2824; --muted:#6b6560; --line:#ddd5c8; --bg:#f6f3ec; --card:#fffdf8; --accent:#8a7348; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.6; }
    .wrap { width:min(1100px, calc(100% - 28px)); margin:0 auto; padding:28px 0 48px; }
    h1 { margin:0 0 8px; font-size:26px; }
    .lead { color:var(--muted); margin:0 0 18px; max-width:70ch; }
    .warn { background:#f5ecd8; border:1px solid #c4a86a; color:#5a4a20; padding:10px 12px; border-radius:10px; margin:12px 0 18px; font-size:14px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .chip { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; }
    .chip.active { background:var(--ink); color:#fff; border-color:var(--ink); }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
    .card img { width:100%; height:140px; object-fit:cover; background:#e8e2d6; display:block; }
    .card .body { padding:10px 12px; }
    .card h3 { margin:0 0 4px; font-size:14px; }
    .card p { margin:0; font-size:12px; color:var(--muted); min-height:3em; }
    .meta { font-size:11px; color:var(--accent); }
    footer { margin-top:28px; font-size:12px; color:var(--muted); }
    a { color:#3d5a80; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>design-assets · 风格预览骨架</h1>
    <p class="lead">
      公开仓提供 <strong>24 风格元数据 + 使用纪律 + 视觉圣经摘要</strong>。
      大图全集不在 Git 对象库中，请使用 Release 附件或本机
      <code>C:\...\Desktop\design-assets</code> 源目录。
    </p>
    <div class="warn">
      <strong>画风纪律（USAGE）：</strong>本库只服务文档 / PPT / 作品集案例，
      <strong>禁止</strong>替换产品 UI 主题（chatez 暖色书房、codedrill 终端绿、CET 图书馆/静墨、kb-ui 自有皮肤等）。
    </div>
    <div class="controls" id="filters">
      <button class="chip active" data-k="all">全部</button>
      <button class="chip" data-k="doc">文档/审计</button>
      <button class="chip" data-k="culture">文化/水墨</button>
      <button class="chip" data-k="tech">科技/终端</button>
      <button class="chip" data-k="playful">游戏/桌宠</button>
    </div>
    <div class="grid" id="grid"></div>
    <footer>
      License CC0 ·
      <a href="./docs/visual-bible/">视觉圣经</a> ·
      <a href="./USAGE.md">USAGE</a> ·
      <a href="https://github.com/anyuer678/design-assets">GitHub</a>
      · 样例图来自 <code>samples/</code>（非全集）
    </footer>
  </div>
  <script src="./preview.js"></script>
</body>
</html>
